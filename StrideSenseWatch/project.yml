name: StrideSenseWatch
options:
  bundleIdPrefix: com.aksharsakhi.stridesense
  deploymentTarget:
    watchOS: "9.0"
settings:
  base:
    DEVELOPMENT_TEAM: 96799QVDJ7
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
targets:
  StrideSenseWatch:
    type: application
    platform: watchOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aksharsakhi.stridesense.watch
        WATCHOS_DEPLOYMENT_TARGET: "9.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "4"
