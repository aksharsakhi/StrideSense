<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>StrideSense - AI Smart Insole & Gait Analytics</title>
    <meta name="description" content="AI-Powered Smart Insole Telemetry Dashboard for Continuous Gait Analysis, Kinematic Tracking, and Fall Detection." />
    <meta name="theme-color" content="#060a12" id="meta-theme-color" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="StrideSense" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('stridesense_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || ((!saved || saved === 'system') && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            var meta = document.getElementById('meta-theme-color');
            if (meta) meta.setAttribute('content', '#060a12');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            var meta = document.getElementById('meta-theme-color');
            if (meta) meta.setAttribute('content', '#ffffff');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body ontouchstart="">
    <div id="root"></div>
    <script>
      // Enable instantaneous touch response on iOS WebKit
      document.addEventListener('touchstart', function() {}, { passive: true });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
